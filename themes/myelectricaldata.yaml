      input-outlined-hover-border-color: "#8fa0b8"
      input-dropdown-icon-color: "#8fa0b8"
      mdc-text-field-fill-color: "#212d40"
      mdc-text-field-ink-color: "#e7edf5"
      mdc-text-field-label-ink-color: "#8fa0b8"
      mdc-text-field-idle-line-color: "#2f3d55"
      mdc-select-fill-color: "#212d40"
      mdc-select-ink-color: "#e7edf5"
      mdc-select-label-ink-color: "#8fa0b8"
      mdc-select-idle-line-color: "#2f3d55"
      mdc-select-dropdown-icon-color: "#8fa0b8"
      mdc-checkbox-unchecked-color: "#8fa0b8"
      mdc-radio-unchecked-color: "#8fa0b8"

      # Puces, tableaux, code
      chip-background-color: "#212d40"
