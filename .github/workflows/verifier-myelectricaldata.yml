# Vérifie une branche de MyElectricalData new (fork ou amont) avant d'ouvrir une PR :
# ruff + mypy + tests unitaires du backend, lint + build du frontend.
name: Vérifier une branche MyElectricalData

on:
  workflow_dispatch:
    inputs:
      repository:
        description: Dépôt à vérifier
        default: Marlboro62/myelectricaldata_new
      ref:
        description: Branche, tag ou commit
        required: true
      tests:
        description: Tests pytest à lancer (vide = tests/unit)
        default: ""

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v4
      - run: uv sync
      # Mêmes contrôles que la CI amont (ruff et mypy sur src), plus les tests.
      # Les erreurs remontent en annotations (lisibles sans accès aux journaux).
      - name: Ruff
        if: always()
        run: uv run ruff check src --output-format=github
      - name: Ruff (tests)
        if: always()
        env:
          TESTS: ${{ inputs.tests }}
        run: uv run ruff check ${TESTS:-tests/unit} --output-format=github
      - name: Mypy
        if: always()
        run: |
          uv run mypy src --ignore-missing-imports > mypy.txt; rc=$?
          grep -E "error:" mypy.txt | head -40 | sed -E 's/^([^:]+):([0-9]+): error: (.*)$/::error file=apps\/api\/\1,line=\2::\3/'
          tail -1 mypy.txt; exit $rc
      - name: Pytest
        if: always()
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          uv run pytest ${TESTS:-tests/unit} -q -p no:cacheprovider > pytest.txt 2>&1; rc=$?
          grep -E "^(FAILED|ERROR) " pytest.txt | head -40 | sed 's/^/::error::/'
          tail -1 pytest.txt | sed 's/^/::notice::/'; exit $rc

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - name: Lint
        if: always()
        run: npm run lint
      - name: Build
        if: always()
        run: npm run build
