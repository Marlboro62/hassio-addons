name: "MyElectricalData v2"
version: "2.0.0.1"
image: "marlboro62/{arch}-myelectricaldata-v2"
slug: "myelectricaldata_v2"
description: "Mode client MyElectricalData v2 (expérimental) : interface web, synchro Linky/Tempo et PostgreSQL intégrés"
url: "https://github.com/Marlboro62/hassio-addons"
stage: experimental
arch:
  - amd64
startup: application
boot: auto
ports:
  8100/tcp: 8100
ports_description:
  8100/tcp: "Interface web MyElectricalData"
webui: "http://[HOST]:[PORT:8100]"
options:
  med_client_id: ""
  med_client_secret: ""
  med_api_url: "https://www.v2.myelectricaldata.fr/api"
  debug: false
schema:
  med_client_id: str
  med_client_secret: password
  med_api_url: url
  debug: bool
