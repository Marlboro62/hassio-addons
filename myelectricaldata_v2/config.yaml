name: "MyElectricalData new"
version: "2.4.4.1"
image: "marlboro62/{arch}-myelectricaldata-new"
slug: "myelectricaldata_new"
description: "Mode client MyElectricalData new (expérimental) : interface web, synchro Linky/Tempo et PostgreSQL intégrés"
url: "https://github.com/Marlboro62/hassio-addons/tree/master/myelectricaldata_new"
stage: experimental
arch:
  - amd64
startup: application
boot: auto
hassio_api: true
map:
  - type: homeassistant_config
    read_only: true
  - type: share
    read_only: true
ports:
  8100/tcp: 8100
  5432/tcp: null
ports_description:
  8100/tcp: "Interface web MyElectricalData (ne pas exposer sur Internet)"
  5432/tcp: "PostgreSQL lecture seule pour Grafana, sans SSL, réseau local uniquement (définir grafana_password, puis renseigner un port ici)"
webui: "http://[HOST]:[PORT:8100]"
options:
  med_client_id: ""
  med_client_secret: ""
  med_api_url: "https://www.v2.myelectricaldata.fr/api"
  debug: false
  import_v1: false
  import_v1_path: "/homeassistant/myelectricaldata/cache.db"
  periode_analyse: "defaut"
  periode_debut: "1/9"
  grafana_password: ""
schema:
  med_client_id: str
  med_client_secret: password
  med_api_url: url
  debug: bool
  import_v1: bool
  import_v1_path: str
  periode_analyse: list(defaut|tempo|glissante|calendaire|personnalisee)
  periode_debut: match(^(0?[1-9]|[12][0-9]|3[01])/(0?[1-9]|1[0-2])$)
  grafana_password: password?
