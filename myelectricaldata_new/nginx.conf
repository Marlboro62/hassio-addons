# Accès direct (port 8100) et accès par l'Ingress de Home Assistant (port 8099).
# L'interface est construite avec la base « /__MED_BASE__/ », remplacée à la volée
# par « / » (accès direct) ou par le chemin fourni par Home Assistant (Ingress).
# Pour l'Ingress, les quelques chemins absolus écrits en dur dans le code
# (API, images, liens) sont aussi préfixés.

server {
    listen 8100;
    root /var/www/med;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        sub_filter_types application/javascript text/javascript text/css application/json;
        sub_filter_once off;
        sub_filter '/__MED_BASE__/' '/';
    }
}

server {
    listen 8099;
    allow 172.30.32.2;
    allow 127.0.0.1;
    deny all;

    root /var/www/med;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host localhost;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";

        sub_filter_types application/javascript text/javascript text/css application/json;
        sub_filter_once off;
        sub_filter 'VITE_BASE_PATH: ""' 'VITE_BASE_PATH: "$http_x_ingress_path"';
        sub_filter '"/api"' '"$http_x_ingress_path/api"';
        sub_filter '"/api/' '"$http_x_ingress_path/api/';
        sub_filter '/__MED_BASE__/' '$http_x_ingress_path/';
        sub_filter '"/env.js"' '"$http_x_ingress_path/env.js"';
        sub_filter '"/addon-version.json"' '"$http_x_ingress_path/addon-version.json"';
        sub_filter '"/favicon' '"$http_x_ingress_path/favicon';
        sub_filter '"/manifest.json"' '"$http_x_ingress_path/manifest.json"';
        sub_filter '"/logo' '"$http_x_ingress_path/logo';
        sub_filter '"/enedis_' '"$http_x_ingress_path/enedis_';
        sub_filter '"/Paypal' '"$http_x_ingress_path/Paypal';
        sub_filter '"/paypal' '"$http_x_ingress_path/paypal';
        sub_filter '"/buy_me' '"$http_x_ingress_path/buy_me';
        sub_filter '"/qr-code' '"$http_x_ingress_path/qr-code';
        sub_filter 'href:"/' 'href:"$http_x_ingress_path/';
    }
}
